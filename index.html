<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>鮨 といろ お品書き</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --gold: #d4af37;
      --gold-dark: #8f7440;
      --text: #f8f2e8;
      --sub-text: #cfc2a5;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0 0 60px;

      background:
        linear-gradient(
          to bottom,
          #050814 0%,
          #090d19 50%,
          #111827 100%
        );

      color: var(--text);

      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
    }


    /* =========================
       ヘッダー
       ========================= */

    .header {
      position: sticky;
      top: 0;

      width: 100%;

      z-index: 1000;

      text-align: center;

      padding: 6px 16px 8px;

      background: rgba(3, 6, 15, 0.97);

      border-bottom:
        1px solid rgba(212, 175, 55, 0.4);

      backdrop-filter: blur(8px);
    }

    .logo {
      width: 55px;

      display: block;

      margin: 0 auto 2px;
    }

    .shop-name {
      font-size: 9px;

      letter-spacing: 3px;

      color: var(--gold);

      margin-bottom: 5px;
    }

    .gold-line {
      width: 100px;
      height: 1px;

      margin: 4px auto 7px;

      background:
        linear-gradient(
          to right,
          transparent,
          var(--gold),
          transparent
        );
    }


    /* =========================
       言語切り替え
       ========================= */

    .language {
      display: flex;

      justify-content: center;

      gap: 8px;
    }

    .language button {
      padding: 6px 16px;

      font-size: 13px;

      font-family: inherit;

      color: var(--text);

      background: transparent;

      border:
        1px solid var(--gold-dark);

      border-radius: 999px;

      cursor: pointer;
    }

    .language button.active {
      color: #050814;

      background: var(--gold);

      border-color: var(--gold);
    }


    /* =========================
       ページ
       ========================= */

    .container {
      width: 100%;

      max-width: 580px;

      margin: 0 auto;

      padding: 18px 16px 0;
    }

    .panel {
      background:
        rgba(255, 255, 255, 0.035);

      border:
        1px solid rgba(212, 175, 55, 0.25);

      border-radius: 16px;

      padding: 24px 18px 30px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;

      font-size: 26px;

      font-weight: normal;

      letter-spacing: 5px;

      margin: 0 0 25px;
    }

    h2 {
      text-align: center;

      font-size: 23px;

      font-weight: normal;

      letter-spacing: 3px;

      margin: 0 0 8px;
    }

    .price {
      text-align: center;

      font-size: 20px;

      color: var(--gold);

      margin-bottom: 25px;
    }


    /* =========================
       最初の画面
       ========================= */

    .top-menu {
      max-width: 450px;

      margin: 0 auto;
    }

    .select-button {
      display: block;

      width: 100%;

      margin: 15px 0;

      padding: 20px 15px;

      font-size: 19px;

      font-family: inherit;

      color: var(--text);

      background:
        rgba(255, 255, 255, 0.035);

      border:
        1px solid rgba(212, 175, 55, 0.5);

      border-radius: 10px;

      cursor: pointer;

      transition: 0.2s;
    }

    .select-button:hover {
      background:
        rgba(212, 175, 55, 0.1);
    }


    /* =========================
       メニュー
       ========================= */

    .menu-page {
      display: none;
    }

    .tap-hint {
      text-align: center;

      font-size: 12px;

      color: var(--sub-text);

      margin-bottom: 20px;
    }

    .category {
      text-align: center;

      font-size: 19px;

      font-weight: bold;

      color: var(--gold);

      letter-spacing: 2px;

      margin-top: 34px;

      margin-bottom: 15px;

      padding-bottom: 8px;

      border-bottom:
        1px solid rgba(212, 175, 55, 0.35);
    }

    .item {
      text-align: center;

      font-size: 17px;

      line-height: 1.9;

      margin: 10px 0;

      padding: 6px 8px;

      color: #f5eee2;

      border-radius: 8px;
    }

    .dish {
      cursor: pointer;

      transition: 0.2s;
    }

    .dish::after {
      content: "  ›";

      color: var(--gold);

      font-size: 18px;
    }

    .dish:hover {
      background:
        rgba(212, 175, 55, 0.08);
    }

    .special-item {
      text-align: center;

      font-size: 19px;

      font-weight: bold;

      margin: 30px 0 18px;

      padding: 14px 10px;

      border-top:
        1px solid rgba(212, 175, 55, 0.25);

      border-bottom:
        1px solid rgba(212, 175, 55, 0.25);

      cursor: pointer;
    }

    .special-item::after {
      content: "  ›";

      color: var(--gold);
    }


    /* =========================
       戻るボタン
       ========================= */

    .back-button {
      display: block;

      margin: 45px auto 0;

      padding: 10px 28px;

      font-size: 15px;

      font-family: inherit;

      color: var(--text);

      background: transparent;

      border:
        1px solid var(--gold-dark);

      border-radius: 999px;

      cursor: pointer;
    }


    /* =========================
       店舗情報
       ========================= */

    .shop-info {
      width: 100%;

      max-width: 580px;

      margin: 45px auto 0;

      padding: 0 16px;

      text-align: center;
    }

    .shop-info-inner {
      padding: 30px 20px;

      border-top:
        1px solid rgba(212, 175, 55, 0.35);
    }

    .shop-info-logo {
      width: 45px;

      opacity: 0.8;

      margin-bottom: 12px;
    }

    .shop-info-title {
      color: var(--gold);

      font-size: 18px;

      letter-spacing: 3px;

      margin-bottom: 25px;
    }

    .shop-info-row {
      margin: 15px 0;

      font-size: 14px;

      line-height: 1.8;

      color: var(--sub-text);
    }

    .shop-info-label {
      color: var(--gold);

      font-size: 12px;

      margin-bottom: 3px;
    }

    .instagram-button {
      display: inline-block;

      margin-top: 18px;

      padding: 10px 26px;

      color: var(--text);

      text-decoration: none;

      border:
        1px solid var(--gold-dark);

      border-radius: 999px;

      font-size: 14px;
    }


    /* =========================
       詳細ポップアップ
       ========================= */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 3000;

      background:
        rgba(0, 0, 0, 0.78);

      padding: 18px;

      align-items: center;

      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      position: relative;

      width: 100%;

      max-width: 500px;

      max-height: 85vh;

      overflow-y: auto;

      background: #090d19;

      border:
        1px solid rgba(212, 175, 55, 0.6);

      border-radius: 16px;

      padding: 30px 22px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .modal-close {
      position: absolute;

      top: 8px;
      right: 12px;

      border: none;

      background: transparent;

      color: white;

      font-size: 30px;

      cursor: pointer;
    }

    .modal-title {
      text-align: center;

      color: var(--gold);

      font-size: 22px;

      font-weight: normal;

      line-height: 1.5;

      margin: 6px 30px 25px;
    }

    .detail-block {
      margin-top: 20px;
    }

    .detail-label {
      color: var(--gold);

      font-size: 14px;

      margin-bottom: 6px;
    }

    .detail-text {
      font-size: 15px;

      line-height: 1.8;
    }

    .allergy-box {
      margin-top: 24px;

      padding: 15px;

      border:
        1px solid rgba(212, 175, 55, 0.35);

      border-radius: 10px;

      background:
        rgba(212, 175, 55, 0.05);
    }

    .allergy-note {
      color: var(--sub-text);

      font-size: 11px;

      line-height: 1.7;

      margin-top: 8px;
    }


    @media screen and (max-width: 480px) {

      .panel {
        padding: 22px 14px 26px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 21px;
      }

      .item {
        font-size: 16px;
      }

      .category {
        font-size: 18px;
      }

    }

  </style>

</head>

/* =========================
   言語変更
   ========================= */

function setLanguage(language) {

currentLanguage = language;


document
.querySelectorAll(".jp")
.forEach(function(element) {

element.style.display =
language === "jp"
? "block"
: "none";

});


document
.querySelectorAll(".en")
.forEach(function(element) {

element.style.display =
language === "en"
? "block"
: "none";

});


document
.getElementById("jpButton")
.classList.toggle(
"active",
language === "jp"
);


document
.getElementById("enButton")
.classList.toggle(
"active",
language === "en"
);


if (currentCourse) {

renderCourse(currentCourse);

}

}



/* =========================
   コース表示
   ========================= */

function showCourse(courseId) {

currentCourse = courseId;


document
.getElementById("home")
.style.display = "none";


document
.getElementById("drinkPage")
.style.display = "none";


document
.getElementById("coursePage")
.style.display = "block";


renderCourse(courseId);


window.scrollTo({
top: 0,
behavior: "smooth"
});

}



/* =========================
   コース生成
   ========================= */

function renderCourse(courseId) {

const course =
courses[courseId];


const english =
currentLanguage === "en";


let html = "";


html +=
"<h2>" +
(english
? "September Course"
: "9月のコース") +
"</h2>";


html +=
'<div class="price">' +
(english
? course.priceEN
: course.priceJP) +
"</div>";


html +=
'<div class="tap-hint">' +
(english
? "Tap a dish to view details"
: "料理名をタップすると詳細をご覧いただけます") +
"</div>";



course.specials.forEach(function(key) {

const dish =
dishes[key][currentLanguage];


html +=
'<div class="special-item" onclick="openDishModal(\'' +
key +
'\')">' +
dish.title +
"</div>";

});



course.sections.forEach(function(section) {


if (section.special) {

section.items.forEach(function(key) {

const dish =
dishes[key][currentLanguage];


html +=
'<div class="special-item" onclick="openDishModal(\'' +
key +
'\')">' +
dish.title +
"</div>";

});


return;

}



html +=
'<div class="category">' +
(english
? section.en
: section.jp) +
"</div>";



section.items.forEach(function(key) {

const dish =
dishes[key][currentLanguage];


html +=
'<div class="item dish" onclick="openDishModal(\'' +
key +
'\')">' +
dish.title +
"</div>";

});


});


document
.getElementById("courseContent")
.innerHTML = html;

}

});

}



/* =========================
   ホーム
   ========================= */

function goHome() {

currentCourse = null;


document
.getElementById("coursePage")
.style.display = "none";


document
.getElementById("drinkPage")
.style.display = "none";


document
.getElementById("home")
.style.display = "block";


setLanguage(currentLanguage);


window.scrollTo({
top: 0,
behavior: "smooth"
});

}



/* =========================
   詳細ポップアップ
   ========================= */

function openDishModal(dishKey) {

const data =
dishes[dishKey][currentLanguage];


const english =
currentLanguage === "en";


document
.getElementById("modalTitle")
.textContent =
data.title;


document
.getElementById("modalDescription")
.textContent =
data.description;


document
.getElementById("modalIngredients")
.textContent =
data.ingredients;


document
.getElementById("modalAllergy")
.textContent =
data.allergens;


document
.getElementById("descriptionLabel")
.textContent =
english
? "About this dish"
: "料理について";


document
.getElementById("ingredientsLabel")
.textContent =
english
? "Main ingredients"
: "主な食材";


document
.getElementById("allergyLabel")
.textContent =
english
? "Possible allergens"
: "想定アレルゲン";


document
.getElementById("allergyNote")
.textContent =
english
? "This information is provisional. Please confirm ingredients and possible cross-contact with our staff before ordering."
: "※こちらは仮の情報です。実際の使用食材・調味料・交差接触については、ご注文前にスタッフへご確認ください。";


document
.getElementById("dishModal")
.classList.add("show");


document.body.style.overflow =
"hidden";

}



/* =========================
   ポップアップを閉じる
   ========================= */

function closeDishModal() {

document
.getElementById("dishModal")
.classList.remove("show");


document.body.style.overflow =
"";

}



function closeModalOutside(event) {

if (
event.target.id === "dishModal"
) {

closeDishModal();

}

}



document.addEventListener(
"keydown",
function(event) {

if (
event.key === "Escape"
) {

closeDishModal();

}

}
);


</script>
