<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お品書き</title>

  <style>
    body {
      margin: 0;
      padding: 35px 20px 60px;
      background-color: #ffffff;
      color: #222222;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: normal;
      margin-bottom: 40px;
      letter-spacing: 3px;
    }

    .menu {
      max-width: 500px;
      margin: 0 auto;
    }

    .category {
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin-top: 35px;
      margin-bottom: 15px;
      padding-bottom: 7px;
      border-bottom: 1px solid #aaaaaa;
    }

    .item {
      text-align: center;
      font-size: 18px;
      line-height: 1.7;
      margin: 12px 0;
    }
  </style>

</head>


<body>

  <h1>季節のおまかせコース</h1>

  <div class="menu">

    <div class="category">強肴</div>

    <div class="item">蟹と菊花の煮浸し</div>
    <div class="item">イチヂク胡麻クリーム和え</div>


    <div class="category">茶碗蒸し</div>

    <div class="item">白子の木の子餡掛けイクラのせ</div>


    <div class="category">鮨</div>

    <div class="item">イカ（炭塩）</div>
    <div class="item">カツオ（高等葱ソース）</div>
    <div class="item">貝（塩スダチ）</div>
    <div class="item">生エビ（エビパウダー）</div>
    <div class="item">島鮨</div>


    <div class="category">焼き物</div>

    <div class="item">秋鮭幽庵焼き</div>


    <div class="category">鮨</div>

    <div class="item">赤身</div>
    <div class="item">中トロ</div>
    <div class="item">白身の昆布〆</div>
    <div class="item">コハダ</div>
    <div class="item">トロタクおはぎ</div>
    <div class="item">イクラの小丼（ウニ添え）</div>
    <div class="item">玉子</div>


    <div class="category">お椀</div>


    <div class="category">甘味</div>

  </div>

</body>

</html>
